<script>
  const email = "{{ interview.email|escapejs }}";  // for evaluation
  const token = "{{ interview.token|escapejs }}";

  document.addEventListener('DOMContentLoaded', function () {
    const leaveLink = document.getElementById('leave-link');

    if (leaveLink) {
      leaveLink.addEventListener('click', function (event) {
        event.preventDefault();  // Prevent immediate navigation

        fetch('/tool/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({ email: email,
                                 token: token
           })
        })
        .then(response => response.json())
        .then(data => {
          console.log("Tool triggered:", data);
          window.location.href = leaveLink.href;  // Now go to /interview/feedback/
        })
        .catch(error => {
          console.error("Error:", error);
        });
      });
    }
  });
</script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const interBubble = document.querySelector(".interactive");
        let curX = 0;
        let curY = 0;
        let tgX = 0;
        let tgY = 0;

        function move() {
          curX += (tgX - curX) / 20;
          curY += (tgY - curY) / 20;
          interBubble.style.transform = `translate(${Math.round(
            curX
          )}px, ${Math.round(curY)}px)`;
          requestAnimationFrame(move);
        }

        window.addEventListener("mousemove", (event) => {
          tgX = event.clientX;
          tgY = event.clientY;
        });

        move();
      });
    </script>

    <!-- *********************Latest proctoring code************************ -->
      <!-- Hidden canvas for capturing frames -->
      <canvas id="canvas" style="display: none;"></canvas>

      <!-- JS to access webcam and send images -->
      <script>
        const video = document.getElementById("videoElement");
        const canvas = document.getElementById("canvas");
        const context = canvas.getContext("2d");
        const AuthToken = "{{ interview.token|escapejs }}";
       
  
        // Ask for camera access
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then((stream) => {
            video.srcObject = stream;
          })
          .catch((err) => {
            console.error("Error accessing camera:", err);
          });
  
        // Capture image every 3 seconds and send to server
        setInterval(() => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
  
          const imageData = canvas.toDataURL("image/jpeg");
          
  
          fetch("/proctoring/", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              'Authorization': `Bearer ${AuthToken}`
            },
            body: JSON.stringify({ image: imageData,
                                   token: AuthToken,
             }),
          })
            .then((response) => response.json())
            .then((data) => {
              console.log("Proctoring response:", data);
              console.log("token:", AuthToken);
            })
            .catch((error) => {
              console.error("Error sending image to server:", error);
            });
        }, 3000);
      </script>

      // Function to get CSRF token from cookies
     /*---------------------SPEECH RECOG.--------------------------*/
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === name + "=") {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

let lastAiResponse = "";
let isMicBusy = false;  // prevent double clicks while AI is thinking/speaking

function setMicState(state) {
  const micIcon = document.getElementById("micIcon");
  const micText = document.getElementById("micText");

  // Reset all classes first
  micIcon.className = "";

  if (state === "listening") {
    micIcon.classList.add("bx", "bx-dots-horizontal-rounded", "bx-flashing", "text-blue-600", "text-4xl");
    micText.textContent = "Listening...";
  } else if (state === "processing") {
    micIcon.classList.add("fa-solid", "fa-spinner", "fa-spin", "text-yellow-500", "text-2xl");
    micText.textContent = "AI thinking...";
  } else if (state === "speaking") {
    micIcon.classList.add("fa-solid", "fa-volume-high", "text-green-500", "text-2xl");
    micText.textContent = "AI speaking...";
  } else {
    // idle / ready
    micIcon.classList.add("fa-solid", "fa-microphone", "text-white", "text-2xl");
    micText.textContent = "Click to speak";
    isMicBusy = false;
  }
}

function speak(aiSpeech) {
  window.speechSynthesis.cancel(); // cancel any ongoing speech first
  const utterance = new SpeechSynthesisUtterance(aiSpeech);
  utterance.lang = "en-US";
  utterance.pitch = 1.2;
  utterance.rate = 1;
  setMicState("speaking");
  utterance.onend = () => {
    setMicState("idle");
  };
  window.speechSynthesis.speak(utterance);
}

function speechrecog() {
  if (isMicBusy) return;  // ignore clicks while busy
  isMicBusy = true;

  let recognization = new webkitSpeechRecognition();
  recognization.lang = "en-US";
  recognization.interimResults = false;
  recognization.maxAlternatives = 1;

  recognization.onstart = () => {
    setMicState("listening");
  };

  recognization.onresult = (e) => {
  console.log("onresult fired");          // ← add
  console.log("isMicBusy:", isMicBusy);   // ← add
  var transcript = e.results[0][0].transcript;

    const csrftoken = getCookie("csrftoken");
    const email = document.getElementById("interviewEmail").value;
    const token = document.getElementById("interviewToken").value;

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/tool/", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("X-CSRFToken", csrftoken);

    xhr.onload = function () {
      if (xhr.status === 200) {
        const response = JSON.parse(xhr.responseText);
        console.log("response: ", JSON.stringify(response, null, 2));

        const messagesContainer = document.getElementById("messagesContainer");
        messagesContainer.innerHTML = "";

        response.transcripts.forEach((item) => {
          const userMessage = document.createElement("div");
          userMessage.classList.add("bg-gray-100", "p-4", "rounded-lg", "shadow-md", "mb-2", "w-fit", "font-semibold");
          userMessage.innerHTML = `<p class="text-left text-gray-700">You: ${item.transcript}</p>`;
          messagesContainer.appendChild(userMessage);

          const aiMessage = document.createElement("div");
          aiMessage.classList.add("bg-blue-100", "p-4", "rounded-lg", "shadow-md", "mb-2", "w-fit", "ml-auto");
          aiMessage.innerHTML = `<p class="text-left text-gray-700">AI: ${item.response}</p>`;
          messagesContainer.appendChild(aiMessage);
          lastAiResponse = item.response;
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (response.should_end_interview) {
          speak(lastAiResponse);
          setTimeout(() => { showInterviewEndModal(); }, 1500);
          return;
        }

        speak(lastAiResponse);

      } else {
        console.log("Error: " + xhr.statusText);
        setMicState("idle");
      }
    };

    xhr.onerror = function() {
      console.log("Network error");
      setMicState("idle");
    };

    xhr.send(JSON.stringify({ email: email, token: token, transcript: transcript }));
  };

  recognization.onerror = (e) => {
    console.log("Speech error: " + e.error);
    setMicState("idle");
  };

  recognization.onend = function () {
    // Only reset to idle if we didn't get a result (user said nothing)
    if (isMicBusy && document.getElementById("micText").textContent === "Listening...") {
      setMicState("idle");
    }
  };

  recognization.start();
}
      // Function to show the interview end modal
      function showInterviewEndModal() {
        const modal = document.getElementById('interviewEndModal');
        const countdownNumber = document.getElementById('countdownNumber');
        const countdownText = document.getElementById('countdownText');
        
        modal.style.display = 'flex';
        
        let countdown = 3;
        const countdownInterval = setInterval(() => {
          countdown--;
          countdownNumber.textContent = countdown;
          countdownText.textContent = countdown;
          
          if (countdown <= 0) {
            clearInterval(countdownInterval);
            window.location.href = '/interview/feedback/';
          }
        }, 1000);
      }
